name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar contenido (ids y enlaces)
        run: npm run validate
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: anaxdevbook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test del contenedor
        run: |
          docker run -d --name app -p 3000:3000 anaxdevbook:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/ > /dev/null
          curl -fs http://localhost:3000/ingenieria/ia-generativa > /dev/null
          curl -fs http://localhost:3000/search-index.json > /dev/null
          docker rm -f app
