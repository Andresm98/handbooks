            html += '<button class="fav-toggle ' + (isFav ? 'is-fav' : '') + '" onclick="toggleFav(\'' + chapter.id + '\')">' + (isFav ? '★ En favoritos' : '☆ Agregar a favoritos') + '</button>';
            html += '</div>';
            html += '<h1 class="topic-title">' + chapter.num + '. ' + esc(chapter.titulo) + '</h1>';
            html += '<p style="color:var(--ink-soft);font-size:14.5px;">' + esc(chapter.resumen) + '</p>';
            html += '<div class="related-pills">' + chapter.tecnologias.map(t => '<span class="pill" style="cursor:default;">' + esc(t) + '</span>').join('') + '</div>';
            html += '</div>';

            html += renderDepRail(chapter);
            html += '<div style="display:flex;gap:14px;margin-bottom:14px;"><button class="expand-all-btn" onclick="setAllCollapsibles(false)">Expandir todo</button><button class="expand-all-btn" onclick="setAllCollapsibles(true)">Colapsar todo</button></div>';

            html += seccion('Definición', '<p>' + esc(c.definicion) + '</p>', 'sec-def');
            html += seccion('El problema que resuelve', '<p>' + esc(c.problema) + '</p>', 'sec-problema');
            html += seccion('Fundamentos', '<p>' + esc(c.fundamentos) + '</p>', 'sec-fund');
            html += seccion('Arquitectura', '<p>' + esc(c.arquitectura) + '</p>', 'sec-arch');
            html += seccion('Funcionamiento interno', '<p>' + esc(c.funcionamiento) + '</p>', 'sec-func');

            let practicasBody = '<div class="two-col"><div class="col-good"><h4>✓ Buenas prácticas</h4>' + listHtml(c.buenas) + '</div>'
                + '<div class="col-bad"><h4>✕ Malas prácticas</h4>' + listHtml(c.malas) + '</div></div>';
            html += seccion('Buenas y malas prácticas', practicasBody, 'sec-practicas');

            html += seccion('Errores comunes', listHtml(c.errores), 'sec-errores');

            let patronesBody = '<h4>Patrones relacionados</h4>' + listHtml(c.patrones) + '<h4>Antipatrones</h4>' + listHtml(c.antipatrones);
            html += seccion('Patrones y antipatrones', patronesBody, 'sec-patrones');

            let ejemplosBody = '<h4>Ejemplo real</h4><p>' + esc(c.ejemploReal) + '</p>'
                + '<h4>Ejemplo en banca</h4><div class="bank-callout">' + esc(c.ejemploBanca) + '</div>'
                + '<h4>Ejemplo empresarial</h4><p>' + esc(c.ejemploEmpresarial) + '</p>';
            html += seccion('Ejemplos', ejemplosBody, 'sec-ejemplos');

            if (c.comparacion) {
                html += seccion('Comparación', renderTableHtml(c.comparacion), 'sec-comparacion');
            }

            let ventajasBody = '<div class="two-col"><div class="col-good"><h4>Ventajas</h4>' + listHtml(c.ventajas) + '</div>'
                + '<div class="col-bad"><h4>Desventajas</h4>' + listHtml(c.desventajas) + '</div></div>';
            html += seccion('Ventajas y desventajas', ventajasBody, 'sec-ventajas');

            if (c.codigo) {
                let codBody = '<p style="font-size:12.5px;color:var(--ink-faint);margin-bottom:6px;">' + esc(c.codigo.lang) + '</p>'
                    + '<pre class="codeblock"><button class="copy-btn" onclick="copyCode(this)">Copiar</button><code>' + highlightCode(c.codigo.code) + '</code></pre>';
                html += seccion('Código de ejemplo', codBody, 'sec-codigo');
            }

            html += seccion('Preguntas frecuentes', renderFaqHtml(c.faq), 'sec-faq');
            html += seccion('Preguntas de entrevista por nivel', renderEntrevistasHtml(chapter.entrevistas), 'sec-entrevistas');
            html += seccion('Ejercicios', listHtml(chapter.ejercicios), 'sec-ejercicios');

            let proyBody = '<div class="project-card"><h4>' + esc(chapter.proyecto.titulo) + '</h4><p>' + esc(chapter.proyecto.desc) + '</p>'
                + '<div class="tag-list">' + chapter.proyecto.tech.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div></div>';
            html += seccion('Proyecto práctico', proyBody, 'sec-proyecto');

            const checkedCount = chapter.checklist.filter((it, idx) => Store.isChecked(chapter.id + '::' + idx)).length;
            let checkBody = '<p style="font-size:12px;color:var(--ink-faint);">' + checkedCount + ' / ' + chapter.checklist.length + ' completados</p>'
                + renderChecklistItems(chapter.checklist, chapter.id);
            html += seccion('Checklist de dominio', checkBody, 'sec-checklist');

            let recBody = '<ul class="resource-list">' + chapter.recursos.map(r => '<li><span class="rl-kind">' + esc(r.kind) + '</span>' + esc(r.label) + '</li>').join('') + '</ul>';
            html += seccion('Recursos', recBody, 'sec-recursos');

            if (HANDBOOK_LINKS[chapter.id]) {
                let hbBody = '<ul class="resource-list">' + HANDBOOK_LINKS[chapter.id].map(l => '<li><span class="rl-kind">Handbook</span><a href="' + l.href + '">' + esc(l.label) + '</a></li>').join('') + '</ul>';
                html += seccion('Profundiza en los handbooks', hbBody, 'sec-handbooks');
            }

            if (chapter.relacionados && chapter.relacionados.length) {
                let relBody = '<div class="related-pills">' + chapter.relacionados.map(id => {
                    const rc = CH_BY_ID[id];
                    return rc ? '<span class="pill" onclick="Router.go(\'chapter/' + id + '\')">' + esc(rc.titulo) + '</span>' : '';
                }).join('') + '</div>';
                html += seccion('Temas relacionados', relBody, 'sec-relacionados');
            }

            html += '</article>';

            document.getElementById('mainInner').innerHTML = html;
            renderToc(chapter);
        }

        function renderToc(chapter) {
            const c = chapter.c;
            const items = [
                { id: 'sec-def', label: 'Definición', exists: true },
                { id: 'sec-problema', label: 'El problema', exists: true },
                { id: 'sec-fund', label: 'Fundamentos', exists: true },
                { id: 'sec-arch', label: 'Arquitectura', exists: true },
                { id: 'sec-func', label: 'Funcionamiento', exists: true },
                { id: 'sec-practicas', label: 'Buenas/malas prácticas', exists: true },
                { id: 'sec-errores', label: 'Errores comunes', exists: true },
                { id: 'sec-patrones', label: 'Patrones', exists: true },
                { id: 'sec-ejemplos', label: 'Ejemplos', exists: true },
                { id: 'sec-comparacion', label: 'Comparación', exists: !!c.comparacion },
                { id: 'sec-ventajas', label: 'Ventajas/desventajas', exists: true },
                { id: 'sec-codigo', label: 'Código', exists: !!c.codigo },
                { id: 'sec-faq', label: 'FAQ', exists: true },
                { id: 'sec-entrevistas', label: 'Entrevista', exists: true },
                { id: 'sec-ejercicios', label: 'Ejercicios', exists: true },
                { id: 'sec-proyecto', label: 'Proyecto', exists: true },
                { id: 'sec-checklist', label: 'Checklist', exists: true },
                { id: 'sec-recursos', label: 'Recursos', exists: true }
            ];
            let html = '<div class="toc-title">En esta página</div>';
            items.filter(i => i.exists).forEach(i => {
                html += '<div class="toc-link" onclick="document.getElementById(\'' + i.id + '\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">' + esc(i.label) + '</div>';
            });
            document.getElementById('toc').innerHTML = html;
        }

        /* ============================================================
           PÁGINAS ESTÁTICAS: ROADMAP, DEPENDENCIAS, MATRIZ
           ============================================================ */
        function renderRoadmap() {
            document.getElementById('toc').innerHTML = '';
            let html = '<div class="home-hero"><h1>Roadmap por nivel</h1><p>Qué dominar en cada etapa, de Principiante a Arquitecto. No es una escalera estrictamente secuencial: varios niveles avanzan en paralelo según el track (backend, frontend, plataforma).</p></div>';
            html += '<div class="level-track">';
            ROADMAP.forEach(r => {
                html += '<div class="level-block"><h3>' + esc(r.nivel) + '</h3>'
                    + '<div class="lb-meta">' + esc(r.duracion) + '</div>'
                    + '<p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;">' + esc(r.resumen) + '</p>'
                    + '<div class="related-pills">' + r.temas.map(id => {
                        const ch = CH_BY_ID[id];
                        return ch ? '<span class="pill" onclick="Router.go(\'chapter/' + id + '\')">' + esc(ch.titulo) + '</span>' : '';
                    }).join('') + '</div></div>';
            });
            html += '</div>';
            document.getElementById('mainInner').innerHTML = html;
        }

        function renderDeps() {
            document.getElementById('toc').innerHTML = '';
            let html = '<div class="home-hero"><h1>Árbol de dependencias</h1><p>Qué conviene aprender antes de cada tema. Un capítulo puede depender de más de uno, y puede a su vez ser prerrequisito de varios — no es un árbol estrictamente jerárquico, sino un mapa de orden recomendado.</p></div>';

            const roots = CHAPTERS.filter(c => (c.prereq || []).length === 0);
            function nodoHtml(chapter, profundidad) {
                const hijos = CHAPTERS.filter(c => (c.prereq || []).includes(chapter.id));
                let h = '<div style="margin-left:' + (profundidad * 22) + 'px; padding:6px 0; border-left:' + (profundidad > 0 ? '1px dashed var(--line-strong); padding-left:12px;' : 'none') + '">';
                h += '<span class="pill" onclick="Router.go(\'chapter/' + chapter.id + '\')">' + chapter.num + '. ' + esc(chapter.titulo) + '</span>';
                h += '<span style="font-size:11px;color:var(--ink-faint);margin-left:8px;">' + esc(chapter.nivel) + '</span>';
                h += '</div>';
                hijos.forEach(hijo => { h += nodoHtml(hijo, profundidad + 1); });
                return h;
            }
            html += '<div class="collapsible"><div class="collapsible-body" style="padding-top:16px;">';
            roots.forEach(r => { html += nodoHtml(r, 0); });
            html += '</div></div>';

            document.getElementById('mainInner').innerHTML = html;
        }

        function renderMatrix() {
            document.getElementById('toc').innerHTML = '';
            let html = '<div class="home-hero"><h1>Matriz de prioridad</h1><p>Nivel requerido, frecuencia en entrevistas, importancia, dificultad y tiempo estimado por capítulo — útil para priorizar tu estudio según el tiempo disponible.</p></div>';
            html += '<table class="dtable"><thead><tr><th>#</th><th>Capítulo</th><th>Dominio</th><th>Nivel</th><th>Frecuencia en entrevistas</th><th>Importancia</th><th>Dificultad</th><th>Tiempo estimado</th></tr></thead><tbody>';
            CHAPTERS.forEach(c => {
                const meta = MATRIX_META[c.id] || { frecuencia: 'Media', importancia: 'Media' };
                html += '<tr style="cursor:pointer" onclick="Router.go(\'chapter/' + c.id + '\')">'
                    + '<td>' + c.num + '</td><td>' + esc(c.titulo) + '</td><td>' + esc(c.dominio) + '</td><td>' + esc(c.nivel) + '</td>'
                    + '<td>' + esc(meta.frecuencia) + '</td><td>' + esc(meta.importancia) + '</td><td>' + c.dificultad + '/5</td><td>' + esc(c.tiempoEstimado) + '</td></tr>';
            });
            html += '</tbody></table>';
            document.getElementById('mainInner').innerHTML = html;
        }

        /* ============================================================
           CHECKLIST GLOBAL, ENTREVISTAS, PROYECTOS, FAVORITOS
           ============================================================ */
        function renderChecklistGlobal() {
            document.getElementById('toc').innerHTML = '';
            updateGlobalProgress();
            let html = '<div class="home-hero"><h1>Checklist global</h1><p>' + TOTAL_CHECKLIST_ITEMS + ' ítems en total, entre el checklist específico de cada capítulo y categorías transversales. Tu progreso se guarda automáticamente en este navegador.</p></div>';

            html += '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:18px 0 8px;">Por capítulo</h3>';
            CHAPTERS.forEach(c => {
                const done = c.checklist.filter((it, idx) => Store.isChecked(c.id + '::' + idx)).length;
                html += seccion(c.num + '. ' + c.titulo + '  (' + done + '/' + c.checklist.length + ')', renderChecklistItems(c.checklist, c.id), 'gck-' + c.id);
            });

            html += '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:22px 0 8px;">Categorías transversales</h3>';
            GLOBAL_CHECKLIST_EXTRA.forEach((cat, catIdx) => {
                const keyPrefix = 'extra' + catIdx;
                const done = cat.items.filter((it, idx) => Store.isChecked(keyPrefix + '::' + idx)).length;
                html += seccion(cat.category + '  (' + done + '/' + cat.items.length + ')', renderChecklistItems(cat.items, keyPrefix), 'gck-extra-' + catIdx);
            });

            document.getElementById('mainInner').innerHTML = html;
        }

        let interviewFilterNivel = null;
        function setInterviewFilter(nivel) {
            interviewFilterNivel = (interviewFilterNivel === nivel) ? null : nivel;
            renderInterviews();
        }
        function renderInterviews() {
            document.getElementById('toc').innerHTML = '';
            let html = '<div class="home-hero"><h1>Preparación de entrevistas</h1><p>Todas las preguntas de los 21 capítulos, filtrables por nivel. Cada respuesta es la respuesta esperada, no una transcripción textual de ningún candidato real.</p></div>';
            html += '<div class="filter-row" style="margin-bottom:18px;">';
            ['Junior', 'Semi Senior', 'Senior', 'Staff/Arquitecto'].forEach(lv => {
                const active = interviewFilterNivel === lv ? 'active' : '';
                html += '<span class="chip ' + active + '" onclick="setInterviewFilter(\'' + lv + '\')">' + esc(lv) + '</span>';
            });
            html += '</div>';

            CHAPTERS.forEach(c => {
                let entrevistas = c.entrevistas;
                if (interviewFilterNivel) entrevistas = entrevistas.filter(e => e.nivel === interviewFilterNivel);
                if (entrevistas.length === 0) return;
                html += seccion(c.num + '. ' + c.titulo, renderEntrevistasHtml(entrevistas), 'int-' + c.id);
            });
            document.getElementById('mainInner').innerHTML = html;
        }

        function renderProjects() {
            document.getElementById('toc').innerHTML = '';
            let html = '<div class="home-hero"><h1>Proyectos prácticos</h1><p>Proyectos capstone que integran varios capítulos, seguidos de un proyecto específico por capítulo.</p></div>';

            html += '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:8px 0;">Proyectos integradores (capstone)</h3>';
            CAPSTONE_PROJECTS.forEach(p => {
                html += '<div class="project-card" style="border-style:solid;">'
                    + '<div class="badge-row"><span class="badge lvl" data-lvl="' + esc(p.nivel) + '">' + esc(p.nivel) + '</span></div>'
                    + '<h4 style="font-size:15px;margin-top:8px;">' + esc(p.titulo) + '</h4><p>' + esc(p.desc) + '</p>'
                    + '<div class="tag-list">' + p.tech.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>'
                    + '<div class="related-pills" style="margin-top:10px;">' + p.capitulos.map(id => {
                        const ch = CH_BY_ID[id]; return ch ? '<span class="pill" onclick="Router.go(\'chapter/' + id + '\')">' + esc(ch.titulo) + '</span>' : '';
                    }).join('') + '</div></div>';
            });

            html += '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:22px 0 8px;">Proyecto por capítulo</h3>';
            html += '<div class="home-grid">';
            CHAPTERS.forEach(c => {
                html += '<div class="home-card" onclick="Router.go(\'chapter/' + c.id + '\')">'
                    + '<div class="hc-num">CAP. ' + c.num + '</div><h3>' + esc(c.proyecto.titulo) + '</h3><p>' + esc(c.proyecto.desc) + '</p></div>';
            });
            html += '</div>';
            document.getElementById('mainInner').innerHTML = html;
        }

        function renderFavorites() {
            document.getElementById('toc').innerHTML = '';
            const favs = CHAPTERS.filter(c => Store.isFav(c.id));
            let html = '<div class="home-hero"><h1>Favoritos</h1><p>Los capítulos que marcaste con ★ para volver rápido a ellos.</p></div>';
            if (favs.length === 0) {
                html += '<p style="color:var(--ink-faint);">Todavía no marcaste ningún capítulo como favorito. Usa la estrella junto a cada tema en la barra lateral o dentro de un capítulo.</p>';
            } else {
                html += '<div class="home-grid">';
                favs.forEach(c => {
                    html += '<div class="home-card" onclick="Router.go(\'chapter/' + c.id + '\')">'
                        + '<div class="hc-num">CAP. ' + c.num + ' · ' + esc(c.nivel) + '</div><h3>' + esc(c.titulo) + '</h3><p>' + esc(c.resumen) + '</p></div>';
                });
                html += '</div>';
            }
            document.getElementById('mainInner').innerHTML = html;
        }

        /* ============================================================
           ROUTER
           ============================================================ */
        const Router = {
            routes: {
                'home': renderHome, 'roadmap': renderRoadmap, 'deps': renderDeps, 'matrix': renderMatrix,
                'checklist': renderChecklistGlobal, 'interviews': renderInterviews, 'projects': renderProjects, 'favorites': renderFavorites
            },
            go(route) { location.hash = '#/' + route; }
        };
        window.Router = Router;

        function closeMobileSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('scrim').classList.remove('open');
        }

        function renderRoute() {
            let hash = location.hash.replace(/^#\/?/, '');
            if (!hash) hash = 'home';
            closeMobileSidebar();
            const mainEl = document.getElementById('main');
            if (mainEl) mainEl.scrollTop = 0;
            if (hash.indexOf('chapter/') === 0) {
                const id = hash.split('/')[1];
                const chapter = CH_BY_ID[id];
                if (chapter) renderChapter(chapter); else renderHome();
            } else if (Router.routes[hash]) {
                Router.routes[hash]();
            } else {
                renderHome();
            }
            Store.data.lastVisited = hash;
            Store.save();
            highlightActiveNav();
            updateGlobalProgress();
        }
        window.addEventListener('hashchange', renderRoute);

        function goToSearchResult(route) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('open');
            Router.go(route);
        }

        function applyTheme() {
            if (Store.data.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.removeAttribute('data-theme');
        }

        /* ============================================================
           INICIALIZACIÓN
           ============================================================ */
        function init() {
            Store.load();
            applyTheme();
            renderSidebar();
            renderRoute();

            document.getElementById('menuBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('scrim').classList.add('open');
            });
            document.getElementById('scrim').addEventListener('click', closeMobileSidebar);

            document.getElementById('themeBtn').addEventListener('click', () => {
                Store.data.theme = (Store.data.theme === 'light') ? 'dark' : 'light';
                Store.save();
                applyTheme();
            });

            const mainEl = document.getElementById('main');
            const backBtn = document.getElementById('backToTop');
            mainEl.addEventListener('scroll', () => {
                backBtn.classList.toggle('show', mainEl.scrollTop > 400);
            });
            backBtn.addEventListener('click', () => mainEl.scrollTo({ top: 0, behavior: 'smooth' }));

            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            searchInput.addEventListener('input', () => {
                const q = searchInput.value;
                if (!q.trim()) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
                const results = buscar(q);
                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="search-empty">Sin resultados para "' + esc(q) + '"</div>';
                } else {
                    searchResults.innerHTML = results.map(r => {
                        const route = r.tipo === 'pagina' ? r.route : 'chapter/' + r.chapterId;
                        return '<div class="search-result-item" onclick="goToSearchResult(\'' + route + '\')">'
                            + '<div class="sr-title">' + esc(r.titulo) + '</div><div class="sr-meta">' + esc(r.sub || '') + '</div></div>';
                    }).join('');
                }
                searchResults.classList.add('open');
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape') { searchResults.classList.remove('open'); searchInput.blur(); }
            });
        }
        init();


    </script>
</body>

</html>
